name: C/C++ CI

on:
    push:
      branches: [ "master" ]
    pull_request:
      branches: [ "master" ]
    workflow_dispatch:  # Enables manual trigger

  jobs:
    build:
      runs-on: [runs-on, env:dev]
      steps:
      - uses: actions/checkout@v4
      - name: configure
        run: ./configure
      - name: make
        run: make
      - name: make check
        run: make check
      - name: make distcheck
        run: make distcheck
